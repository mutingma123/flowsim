# Configuration for the /code-health check pass. Generated by `--init` and meant to be
# edited: every value below was inferred from this repository, with the reasoning kept
# beside it so a wrong guess is visible rather than silent.

source_roots = ["flowsim", "tests", "examples", "benchmarks"]

# manim/ is out of scope for code health (its own environment and videos).
exclude = [
    "**/.pixi/**",
    "**/site-packages/**",
    "**/node_modules/**",
    "**/.venv/**",
    "manim/**",
]

# pixi.toml is present; the measurement tools resolve through this runner
runner = "pixi run -e code-health"

# Defaults. Measured across three research repositories of 328, 1,858, and 5,516
# functions, these sit at roughly p95/p90/p95 of each one's own distribution, so they
# flag the tail rather than the body. crap = 30 is the score's conventional threshold
# and matches the fallback in checks/common.py and the table in reference.md, so a repo
# with a generated config and one without flag the same functions. It also sits above
# cyclomatic = 15 for a reason: CRAP collapses to CC at full coverage, so a bar at or
# below 15 would fire on every function the cyclomatic rule already reports, however
# well tested, and say nothing the cyclomatic rule had not.
[thresholds]
cyclomatic = 15
lines      = 100
args       = 8
nesting    = 5
crap       = 30
clone_min_statements = 8
# Structure ranks first. A file over file_lines, or an entry-point script running
# more than script_top_level statements at module level, is a stage that has not
# been cut into stages. 1,000 lines flags roughly a third of the files over 500 in
# a large pipeline repo, which is the tail rather than the body.
file_lines        = 1000
script_top_level  = 40
wall_regress_pct = 20
mem_regress_pct  = 25

# The only part of the suite that executes your code. max_minutes is the budget per
# task: a task whose recorded median already exceeds it is not run and is reported as
# unmeasured, and one that overruns it is killed. A task that finishes but takes
# longer than profile_above_seconds is re-run under cProfile (when twice its wall
# time fits the budget) so its time is attributed to project functions (PERF4).
[smoke]
# The three benchmarks/bench.py cases. `pixi run bench` repeats each three times.
cpu = ["bench-run", "bench-compare", "bench-dashboard"]
gpu = []  # FlowSim runs on CPU only (owner, 2026-11-05).
max_minutes = 10
profile_above_seconds = 60

# The full suite, browser tests included.
[coverage]
tasks = ["test"]

# ruff's defect tiers only. Import ordering and micro-style are the formatter's job and
# would otherwise outnumber every substantive finding.
[ruff]
select = "F,B,PLE"

[rules]
# 26 files import polars
dataframe_library = "polars"
# None (owner, 2026-11-05): output/ is regenerated by the example tasks and holds no raw data.
readonly_globs    = []
# Producers writing here should emit a run manifest beside the artifact.
artifact_globs    = []
# Unused: artifact_globs is empty, so PR1 is off.
manifest_suffix   = ".run.json"
# no generated *variables*.tex found
numeric_ssot      = ""
# PR3 is opt-in: in a repo of one-off scripts, unreachable-from-a-task is normal.
require_task_reachable = false
disabled          = []
# Test code beyond test_*.py and tests/ (smoke scripts, fixtures): its clones and
# long files rank with complexity instead of first.
test_code         = []
